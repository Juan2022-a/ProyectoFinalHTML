<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Qué quieres comer?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sheet">
  <div class="rule-top"></div>
  <h1>¿Qué quieres comer?</h1>
  <p class="subhead">Dime qué ingredientes tienes en casa y te propongo algunas recetas que puedes hacer con ellos.</p>

  <div class="tabs">
    <button class="tab activa" data-tab="buscar">Buscar</button>
    <button class="tab" data-tab="historial">Historial<span class="cuenta" id="cuenta-historial"></span></button>
    <button class="tab" data-tab="guardadas">Guardadas<span class="cuenta" id="cuenta-guardadas"></span></button>
  </div>

  <!-- BUSCAR -->
  <div class="panel activo" id="panel-buscar">
    <div class="field-block">
      <label class="field-label" for="ingredientes">Tengo...</label>
      <input type="text" class="campo" id="ingredientes" placeholder="huevos, tomates, cebolla" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>

    <div class="field-block" style="margin-top:26px;">
      <label class="field-label" for="restricciones">Alergias o ingredientes que no quiero</label>
      <input type="text" class="campo" id="restricciones" placeholder="maní, mariscos, cilantro" autocomplete="off">
    </div>
    <div class="chips" id="chips-restricciones"></div>

    <div class="row">
      <button class="primary" id="buscar">Buscar recetas</button>
      <button class="secondary" id="limpiar">Limpiar</button>
      <span class="hint">Sepáralos con comas</span>
    </div>

    <div id="estado"><span class="spinner"></span><span id="estado-texto">Buscando recetas...</span></div>
    <div id="error"></div>
    <div id="resultados"></div>
  </div>

  <!-- HISTORIAL -->
  <div class="panel" id="panel-historial">
    <div class="panel-barra">
      <h2 class="panel-titulo">Recetas que has visto</h2>
      <button class="link-btn" id="borrar-historial" style="display:none;">Borrar historial</button>
    </div>
    <div id="lista-historial"></div>
  </div>

  <!-- GUARDADAS -->
  <div class="panel" id="panel-guardadas">
    <div class="panel-barra">
      <h2 class="panel-titulo">Mis recetas guardadas</h2>
    </div>
    <div id="lista-guardadas"></div>
  </div>
</div>


<script src="script.js"></script>
</body>
</html>
