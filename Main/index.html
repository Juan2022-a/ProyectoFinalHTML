<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Qué quieres comer?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sheet">
  <header class="top-bar">
    <div>
      <h1>¿Qué quieres comer?</h1>
      <p class="subhead">Dime qué ingredientes tienes en casa y te propongo algunas recetas que puedes hacer con ellos.</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <span id="theme-label">Oscuro</span>
    </button>
  </header>

  <div class="tabs">
    <button class="tab activa" data-tab="buscar">Buscar</button>
    <button class="tab" data-tab="historial">Historial<span class="cuenta" id="cuenta-historial"></span></button>
    <button class="tab" data-tab="guardadas">Guardadas<span class="cuenta" id="cuenta-guardadas"></span></button>
  </div>

  <div class="panel activo" id="panel-buscar">
    <div class="search-card">
      <div class="field-block">
        <label class="field-label" for="ingredientes">Ingredientes disponibles</label>
        <input type="text" class="campo" id="ingredientes" placeholder="Ej. huevos, frijoles, plátano, tomate..." autocomplete="off">
        <div class="chips" id="chips"></div>

        <div class="despensa-bloque">
          <span class="despensa-label">Básicos de casa (toca para agregar):</span>
          <div class="despensa-lista" id="despensa-rapida">
            <button type="button" class="btn-despensa" data-ing="Huevos">+ Huevos</button>
            <button type="button" class="btn-despensa" data-ing="Frijoles">+ Frijoles</button>
            <button type="button" class="btn-despensa" data-ing="Plátano">+ Plátano</button>
            <button type="button" class="btn-despensa" data-ing="Arroz">+ Arroz</button>
            <button type="button" class="btn-despensa" data-ing="Tomate">+ Tomate</button>
            <button type="button" class="btn-despensa" data-ing="Cebolla">+ Cebolla</button>
            <button type="button" class="btn-despensa" data-ing="Chile verde">+ Chile verde</button>
            <button type="button" class="btn-despensa" data-ing="Ajo">+ Ajo</button>
            <button type="button" class="btn-despensa" data-ing="Queso">+ Queso</button>
            <button type="button" class="btn-despensa" data-ing="Crema">+ Crema</button>
            <button type="button" class="btn-despensa" data-ing="Cuajada">+ Cuajada</button>
            <button type="button" class="btn-despensa" data-ing="Aguacate">+ Aguacate</button>
            <button type="button" class="btn-despensa" data-ing="Pollo">+ Pollo</button>
            <button type="button" class="btn-despensa" data-ing="Chorizo">+ Chorizo</button>
            <button type="button" class="btn-despensa" data-ing="Salchicha">+ Salchicha</button>
            <button type="button" class="btn-despensa" data-ing="Papa">+ Papa</button>
            <button type="button" class="btn-despensa" data-ing="Tortillas">+ Tortillas</button>
            <button type="button" class="btn-despensa" data-ing="Pan francés">+ Pan francés</button>
          </div>
        </div>
      </div>

      <div class="field-block" style="margin-top:20px;">
        <label class="field-label" for="restricciones">Alergias o ingredientes a evitar</label>
        <input type="text" class="campo" id="restricciones" placeholder="Ej. maní, mariscos, cilantro..." autocomplete="off">
        <div class="chips" id="chips-restricciones"></div>
      </div>

      <div class="row">
        <button class="primary" id="buscar">Buscar recetas</button>
        <button class="secondary" id="actualizar" style="display:none;">Actualizar recetas</button>
        <button class="ghost" id="limpiar">Limpiar</button>
        <span class="hint">Separa los ingredientes con comas</span>
      </div>
    </div>

    <div id="estado"><span class="spinner"></span><span id="estado-texto">Buscando recetas...</span></div>
    <div id="error"></div>
    <div id="resultados"></div>
  </div>

  <div class="panel" id="panel-historial">
    <div class="panel-barra">
      <h2 class="panel-titulo">Recetas que has visto</h2>
      <button class="link-btn" id="borrar-historial" style="display:none;">Borrar historial</button>
    </div>
    <div id="lista-historial"></div>
  </div>

  <div class="panel" id="panel-guardadas">
    <div class="panel-barra">
      <h2 class="panel-titulo">Mis recetas guardadas</h2>
    </div>
    <div id="lista-guardadas"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
